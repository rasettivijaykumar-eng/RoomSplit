<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RoomSplit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    
    <button id="theme-toggle" class="btn btn-link text-decoration-none position-absolute top-0 end-0 m-4" style="color: var(--text-primary);">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card animate-fade-in text-center p-5">
                    <a href="../index.html" class="logo justify-content-center mb-4">
                        <i class="fa-solid fa-wallet"></i> RoomSplit
                    </a>
                    <h3 class="mb-4">Welcome Back</h3>
                    <div id="alert" class="alert d-none"></div>
                    <form id="loginForm">
                        <div class="mb-3 text-start">
                            <label class="form-label text-secondary">Email address</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label text-secondary">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn-primary w-100">Login</button>
                    </form>
                    <p class="mt-4 text-secondary">Don't have an account? <a href="register.html" class="text-decoration-none fw-bold" style="color: var(--primary-color);">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert');
            
            try {
                const data = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                setToken(data.access_token);
                window.location.href = 'dashboard.html';
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.classList.remove('d-none');
                alertBox.textContent = err.message;
            }
        });
    </script>
</body>
</html>

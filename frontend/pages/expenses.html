<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - RoomSplit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .wrapper { display: flex; width: 100%; }
        .sidebar { width: 250px; min-height: 100vh; background: var(--card-bg); border-right: 1px solid var(--card-border); padding: 20px; }
        .content { flex-grow: 1; padding: 20px; }
        .nav-link { color: var(--text-secondary); padding: 10px 15px; border-radius: 8px; margin-bottom: 5px; transition: all 0.2s; }
        .nav-link:hover, .nav-link.active { background: rgba(79, 70, 229, 0.1); color: var(--primary-color); }
        .expense-card { border-left: 4px solid var(--primary-color); margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar glass-card border-0 rounded-0">
            <a href="#" class="logo mb-5 d-block">
                <i class="fa-solid fa-wallet"></i> RoomSplit
            </a>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="expenses.html"><i class="fa-solid fa-receipt me-2"></i> Expenses</a></li>
                <li class="nav-item"><a class="nav-link" href="settlements.html"><i class="fa-solid fa-handshake me-2"></i> Settlements</a></li>
                <li class="nav-item"><a class="nav-link" href="room.html"><i class="fa-solid fa-users me-2"></i> Room Settings</a></li>
            </ul>
        </nav>

        <main class="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Expenses</h2>
                <button class="btn-primary" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
                    <i class="fa-solid fa-plus me-2"></i> Add Expense
                </button>
            </div>

            <div id="expensesList" class="animate-fade-in">
                <!-- Expenses will be loaded here -->
            </div>
        </main>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal fade" id="addExpenseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content glass-card" style="background: var(--bg-gradient);">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Add New Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="expenseForm">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" id="expTitle" class="form-control" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Amount (₹)</label>
                                <input type="number" id="expAmount" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Category</label>
                                <select id="expCategory" class="form-control" required>
                                    <option value="Rent">Rent</option>
                                    <option value="Groceries">Groceries</option>
                                    <option value="Electricity">Electricity</option>
                                    <option value="Wi-Fi">Wi-Fi</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Paid By</label>
                            <select id="expPayer" class="form-control" required>
                                <!-- Members -->
                            </select>
                        </div>
                        <p class="text-secondary small mb-3"><i class="fa-solid fa-info-circle"></i> Expense will be split equally among all approved members.</p>
                        <button type="submit" class="btn-primary w-100">Save Expense</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let roomMembers = [];
        
        document.addEventListener('DOMContentLoaded', async () => {
            if(!getToken()) { window.location.href = 'login.html'; return; }
            
            const roomId = localStorage.getItem('activeRoomId');
            if(!roomId) { window.location.href = 'room.html'; return; }
            
            loadExpenses(roomId);
            
            // Load members for dropdown
            try {
                const members = await apiFetch(`/rooms/${roomId}/members`);
                roomMembers = members.filter(m => m.status === 'Approved');
                const select = document.getElementById('expPayer');
                roomMembers.forEach(m => {
                    select.innerHTML += `<option value="${m.user_id}">${m.user_info.name}</option>`;
                });
            } catch(e) { console.error(e); }
        });

        async function loadExpenses(roomId) {
            try {
                const expenses = await apiFetch(`/expenses/${roomId}`);
                const list = document.getElementById('expensesList');
                list.innerHTML = '';
                
                if(expenses.length === 0) {
                    list.innerHTML = '<div class="glass-card text-center p-5 text-secondary">No expenses added yet.</div>';
                    return;
                }
                
                expenses.forEach(exp => {
                    const date = new Date(exp.date).toLocaleDateString();
                    list.innerHTML += `
                        <div class="glass-card expense-card d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1">${exp.title}</h5>
                                <small class="text-secondary"><span class="badge bg-secondary me-2">${exp.category}</span> ${date}</small>
                            </div>
                            <div class="text-end">
                                <h4 class="text-primary mb-0">₹${exp.total_amount}</h4>
                            </div>
                        </div>
                    `;
                });
            } catch(err) { console.error(err); }
        }

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roomId = localStorage.getItem('activeRoomId');
            const title = document.getElementById('expTitle').value;
            const amount = parseFloat(document.getElementById('expAmount').value);
            const category = document.getElementById('expCategory').value;
            const payerId = document.getElementById('expPayer').value;
            
            // Equal split logic
            const splitAmount = amount / roomMembers.length;
            const splits = roomMembers.map(m => ({
                user_id: m.user_id,
                amount_owed: splitAmount
            }));
            
            const payload = {
                title, category, total_amount: amount,
                paid_by: [{ user_id: payerId, amount: amount }],
                splits: splits
            };
            
            try {
                await apiFetch(`/expenses/${roomId}`, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                // Hide modal using bootstrap
                const modal = bootstrap.Modal.getInstance(document.getElementById('addExpenseModal'));
                modal.hide();
                document.getElementById('expenseForm').reset();
                
                loadExpenses(roomId);
            } catch(err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>

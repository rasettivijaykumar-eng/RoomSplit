<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settlements - RoomSplit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .wrapper { display: flex; width: 100%; }
        .sidebar { width: 250px; min-height: 100vh; background: var(--card-bg); border-right: 1px solid var(--card-border); padding: 20px; }
        .content { flex-grow: 1; padding: 20px; }
        .nav-link { color: var(--text-secondary); padding: 10px 15px; border-radius: 8px; margin-bottom: 5px; transition: all 0.2s; }
        .nav-link:hover, .nav-link.active { background: rgba(79, 70, 229, 0.1); color: var(--primary-color); }
        .settlement-card { border-left: 4px solid #F59E0B; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar glass-card border-0 rounded-0">
            <a href="#" class="logo mb-5 d-block">
                <i class="fa-solid fa-wallet"></i> RoomSplit
            </a>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="expenses.html"><i class="fa-solid fa-receipt me-2"></i> Expenses</a></li>
                <li class="nav-item"><a class="nav-link active" href="settlements.html"><i class="fa-solid fa-handshake me-2"></i> Settlements</a></li>
                <li class="nav-item"><a class="nav-link" href="room.html"><i class="fa-solid fa-users me-2"></i> Room Settings</a></li>
            </ul>
        </nav>

        <main class="content">
            <h2 class="mb-4">Settlements</h2>
            
            <div class="row g-4 mb-4">
                <div class="col-md-8">
                    <div class="glass-card h-100">
                        <h5 class="mb-4">Who Owes Whom</h5>
                        <div id="transactionsList">
                            <!-- Transactions -->
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card h-100">
                        <h5 class="mb-4">Record Payment</h5>
                        <form id="paymentForm">
                            <div class="mb-3">
                                <label class="form-label">Pay To</label>
                                <select id="payTo" class="form-control" required></select>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Amount (₹)</label>
                                <input type="number" id="payAmount" class="form-control" required>
                            </div>
                            <button type="submit" class="btn-primary w-100">Record Payment</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if(!getToken()) { window.location.href = 'login.html'; return; }
            
            const roomId = localStorage.getItem('activeRoomId');
            if(!roomId) { window.location.href = 'room.html'; return; }
            
            loadSettlements(roomId);
            
            try {
                const user = await apiFetch('/auth/me');
                const members = await apiFetch(`/rooms/${roomId}/members`);
                const select = document.getElementById('payTo');
                members.filter(m => m.status === 'Approved' && m.user_id !== user._id).forEach(m => {
                    select.innerHTML += `<option value="${m.user_id}">${m.user_info.name}</option>`;
                });
            } catch(e) { console.error(e); }
        });

        async function loadSettlements(roomId) {
            try {
                const data = await apiFetch(`/settlements/${roomId}`);
                const list = document.getElementById('transactionsList');
                list.innerHTML = '';
                
                if(data.transactions.length === 0) {
                    list.innerHTML = '<p class="text-secondary">All settled up! No pending dues.</p>';
                    return;
                }
                
                data.transactions.forEach(txn => {
                    list.innerHTML += `
                        <div class="glass-card settlement-card d-flex justify-content-between align-items-center p-3">
                            <div>
                                <strong>${txn.from_name}</strong> owes <strong>${txn.to_name}</strong>
                            </div>
                            <h5 class="text-danger mb-0">₹${txn.amount.toFixed(2)}</h5>
                        </div>
                    `;
                });
            } catch(err) { console.error(err); }
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roomId = localStorage.getItem('activeRoomId');
            const payTo = document.getElementById('payTo').value;
            const amount = parseFloat(document.getElementById('payAmount').value);
            
            try {
                await apiFetch(`/settlements/${roomId}/payments`, {
                    method: 'POST',
                    body: JSON.stringify({ paid_to: payTo, amount: amount })
                });
                
                document.getElementById('paymentForm').reset();
                loadSettlements(roomId);
                alert("Payment recorded successfully!");
            } catch(err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
